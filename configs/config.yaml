# HotPlex Worker Gateway - Base Configuration
#
# Sensible defaults for both dev and prod. Override via:
#   1. Inheritance: config-dev.yaml / config-prod.yaml (inherits this file)
#   2. Environment variables: HOTPLEX_* (highest priority, auto-detected if key exists here)
#   3. Secrets provider: admin tokens (never in config files)
#
# Code defaults live in internal/config/config.go:Default().

# ─────────────────────────────────────────────────────────────────────────────
# CORE NETWORK (Gateway)
# ─────────────────────────────────────────────────────────────────────────────

gateway:
  # Bind to localhost by default for security.
  # Change to ":8888" to listen on all interfaces (e.g. behind a reverse proxy).
  addr: "localhost:8888"
  read_buffer_size: 4096
  write_buffer_size: 4096
  ping_interval: 54s
  pong_timeout: 60s
  write_timeout: 10s
  idle_timeout: 5m
  max_frame_size: 32768
  broadcast_queue_size: 256
  
  # Advanced performance tuning for messaging platforms
  platform_write_buffer: 64
  platform_drop_threshold: 56
  delta_coalesce_interval: 120ms
  delta_coalesce_size: 200

# ─────────────────────────────────────────────────────────────────────────────
# ADMIN API
# ─────────────────────────────────────────────────────────────────────────────

admin:
  enabled: true
  # Bind to localhost by default. Change to ":9999" to expose.
  addr: "localhost:9999"
  # Tokens must be provided via HOTPLEX_ADMIN_TOKEN_1..N env vars
  tokens: []
  default_scopes: ["session:read", "session:write", "session:delete", "stats:read", "health:read", "admin:write"]
  ip_whitelist_enabled: false
  allowed_cidrs: ["127.0.0.0/8", "10.0.0.0/8"]
  rate_limit_enabled: true
  requests_per_sec: 10
  burst: 20

# ─────────────────────────────────────────────────────────────────────────────
# DATA & PERSISTENCE
# ─────────────────────────────────────────────────────────────────────────────

db:
  # Driver: "sqlite" (default) or "postgres".
  # When set to "postgres", the postgres sub-config is used.
  driver: "sqlite"

  # ── SQLite configuration (default) ─────────────────────────────────────
  # Legacy flat fields (path, wal_mode, etc.) are also supported for backward
  # compatibility. When both flat and structured fields are present, the
  # structured fields take precedence.
  sqlite:
    path: ~/.hotplex/data/hotplex.db
    wal_mode: true
    busy_timeout: 5s
    max_open_conns: 3         # 1 writer + 2 readers for shared session/event store
    vacuum_threshold: 0.2     # VACUUM when 20%+ free pages
    cache_size_kib: 8192
    mmap_size_mib: 64
    wal_autocheckpoint: 2000

  # Legacy flat fields (backward compatible, maps to sqlite.*).
  # These are DEPRECATED — use the structured sqlite.* format instead.
  path: ~/.hotplex/data/hotplex.db
  events_path: ""           # Deprecated: events table lives in hotplex.db
  wal_mode: true
  busy_timeout: 5s
  max_open_conns: 3         # 1 writer + 2 readers for shared session/event store
  vacuum_threshold: 0.2     # VACUUM when 20%+ free pages
  cache_size_kib: 8192
  mmap_size_mib: 64
  wal_autocheckpoint: 2000

  # ── PostgreSQL configuration (optional) ────────────────────────────────
  # Uncomment and set driver: "postgres" to use PostgreSQL instead of SQLite.
  # postgres:
  #   dsn: "postgres://user:password@localhost:5432/hotplex?sslmode=prefer"
  #   max_open_conns: 25

# ─────────────────────────────────────────────────────────────────────────────
# SECURITY & AUTH
# ─────────────────────────────────────────────────────────────────────────────

security:
  # SameSite attribute for session cookie.
  # Options: "lax" (default, allows HTTP intranet/LAN deployments), "none" (required for HTTPS cross-origin), "strict", "default".
  # Can be overridden by HOTPLEX_SECURITY_COOKIE_SAME_SITE env var.
  cookie_same_site: "lax"
  api_key_header: "X-API-Key"
  # APIKeys must be provided via HOTPLEX_SECURITY_API_KEY_1..N env vars
  api_keys: []
  # api_key_users maps API key values (or env var names) to user identities.
  # When set, the resolved userID flows into session isolation (UUIDv5 key,
  # SEC-008 cross-user rejection, per-user quotas). Without mapping, all keys
  # resolve to "api_user" (shared namespace).
  # Example (env var names resolved at load time):
  #   api_key_users:
  #     HOTPLEX_SECURITY_API_KEY_1: "alice"
  #     HOTPLEX_SECURITY_API_KEY_2: "bob"
  # Or with literal key values:
  #   api_key_users:
  #     "sk-actual-key-value": "alice"
  api_key_users: {}
  # Resolver chain: DB (Admin API CRUD) → YAML config. DB entries override config.
  # No configuration needed — the chain is always active when the table exists.
  tls_enabled: false
  tls_cert_file: "/etc/hotplex/tls/server.crt"
  tls_key_file: "/etc/hotplex/tls/server.key"
  # Allowed CORS origins for gateway API, admin API, and WebSocket connections.
  # Default: ["*"] (allows all origins — suitable for development).
  # Production: pin to specific origins to prevent cross-origin attacks, e.g.:
  #   allowed_origins:
  #     - "https://app.example.com"
  #     - "https://admin.example.com"
  # Can be overridden at runtime by HOTPLEX_SECURITY_ALLOWED_ORIGINS env var
  # (comma-separated list, e.g. "https://app.example.com,https://admin.example.com").
  # A startup WARN log fires when wildcard "*" is in effect.
  allowed_origins:
    - "http://127.0.0.1:8888"
    - "http://localhost:8888"
  # Content-Security-Policy header served with the embedded webchat SPA and
  # docs portal. Leave empty to use the package-level default, which is
  # INTENTIONALLY permissive: connect-src uses the CSP scheme keywords
  # (http: / https: / ws: / wss:) so the SPA can reach any backend host
  # without configuration — required for zero-config remote deployments.
  # A startup WARN log fires when this default is in effect to flag the
  # production exposure. Pin a strict directive to silence the warning and
  # restrict the SPA, e.g.:
  #   csp: "default-src 'self'; script-src 'self' 'unsafe-inline' 'unsafe-eval'; connect-src 'self' http://192.168.1.100:9999 ws://192.168.1.100:9999 wss://*; img-src 'self' data: blob:; font-src 'self' data:"
  # Can be overridden at runtime by HOTPLEX_SECURITY_CSP env var.
  csp: ""
  # Contact URI for /.well-known/security.txt (RFC 9116).
  # When set, the security.txt endpoint is enabled. Empty = disabled.
  # Examples: "mailto:security@example.com", "https://example.com/security-policy"
  # Can be overridden at runtime by HOTPLEX_SECURITY_SECURITY_CONTACT env var.
  security_contact: ""

  # Work directory security settings (convention + configuration)
  # Program defaults (convention over configuration):
  #   - ~/.hotplex/workspace (HotPlex convention)
  #   - ~/workspace, ~/projects, ~/work, ~/dev (common developer patterns)
  #   - /var/hotplex/projects (production, if exists)
  #   - Temp directories
  # Config below supplements program defaults (whitelist priority):
  work_dir_allowed_base_patterns:
    # - "~/custom_projects"  # Extra whitelist: supports ~ and ${VAR} expansion
    # - "/opt/projects"       # Absolute path
  work_dir_forbidden_dirs:
    # - "/srv/deployments"    # Extra blacklist: explicitly forbidden

# ─────────────────────────────────────────────────────────────────────────────
# SESSION & RESOURCE POOL
# ─────────────────────────────────────────────────────────────────────────────

session:
  retention_period: 168h    # Legacy session expiry; new lifecycle policy uses lifecycle.conversation.*
  gc_scan_interval: 1m
  max_concurrent: 1000

events:
  retention: 720h            # Fallback TTL for legacy event/turn rows without per-record expiry.

execution:
  queue:
    enabled: false
    per_session: 20
    global: 1000
    max_payload_bytes: 65536
    interactive_ttl: 15m
    ttl: 24h
    sweep_interval: 1m
    sweep_batch: 100

# Retention defaults for newly written lifecycle records. Existing records keep
# their assigned policy and deadlines until an explicit preview/apply migration.
lifecycle:
  policy: v2
  conversation:
    archive_after: 168h                     # No valid user input; still viewable and resumable.
    retention_after_last_input: 4320h        # 180 days from the last valid user input.
  content:
    retention: 4320h                         # Each message expires from its own creation time.
  effect_payload:
    retention_after_settlement: 168h         # Keep retry/delivery bodies briefly after settlement.
  facts:
    retention_after_settlement: 2160h        # 90 days; retain status and dedupe evidence separately.
  audit:
    capture_content: false                   # Reserved; true is rejected until separate payload storage exists.
    facts_retention: 4320h
    content_retention: 4320h                 # Reserved with capture_content; facts remain bodyless.
  media:
    retention: 24h
  trace:
    retention: 48h
  gc:
    batch_size: 100
    interval: 1m
    max_lag: 1h

pool:
  min_size: 0
  max_size: 100
  max_idle_per_user: 5
  max_memory_per_user: 3221225472  # 3GB (bytes)

# ─────────────────────────────────────────────────────────────────────────────
# WORKER RUNTIME
# ─────────────────────────────────────────────────────────────────────────────

worker:
  max_lifetime: 24h
  idle_timeout: 60m
  execution_timeout: 30m
  turn_timeout: 30m # Absolute maximum duration for one accepted turn.
  default_work_dir: ~/.hotplex/workspace
  pid_dir: ~/.hotplex/.pids
  # Default permission mode tier (read-only, workspace, auto-edit, bypass)
  # applied to workspaces with no explicit override (seeded "workspace").
  # Empty/unset in workspaces allows each worker to run under its own default/config.
  default_permission_mode: "workspace"

  # Environment variables to block from workers (prefix match with trailing "_").
  env_blocklist: []

  # Extra environment variables for all worker processes (highest priority).
  # These override all other env sources.
  # NOTE: these go to workers via cmd.Env (env.go Phase 7), NOT via
  # --settings JSON (removed in commit fixing #622 — that path broke CCR
  # which appends its own --settings, causing Claude to error out).
  # For network env (NO_PROXY, HTTP_PROXY, etc.), the HOTPLEX_WORKER_<NAME>
  # .env mechanism is preferred — it only sets cmd.Env without polluting
  # worker.environment defaults.
  environment:
    - GH_TOKEN=${HOTPLEX_WORKER_GH_TOKEN}
    - GITHUB_TOKEN=${HOTPLEX_WORKER_GITHUB_TOKEN}
  # - BUN_JSC_useJIT=0  # JIT workaround for Bun SIGILL on broken AVX VPS (severe perf penalty)

  auto_retry:
    enabled: true
    max_retries: 9
    base_delay: 5s
    max_delay: 120s
    retry_input: "继续"
    notify_user: true
    # Regex patterns for retryable errors (appended to system defaults like 429, 500).
    patterns: []

  claude_code:
    # Command to start Claude Code worker. Default: "claude"
    # Override via HOTPLEX_WORKER_CLAUDE_CODE_COMMAND environment variable.
    command: "claude"
    # Enable --permission-prompt-tool stdio for forwarding permission requests
    # to Slack/Feishu interaction UI. When false (default), Claude Code auto-denies
    # permission requests in headless mode (no user interaction).
    permission_prompt: true
    # Tool names to auto-approve without forwarding to user interaction UI.
    # These tools are approved silently when permission_prompt is enabled.
    permission_auto_approve:
      - "ExitPlanMode"

  opencode_server:
    # Command to start OpenCode Server. Default: "opencode"
    # Override via HOTPLEX_WORKER_OPENCODE_SERVER_COMMAND environment variable.
    command: "opencode"
    idle_drain_period: 30m
    ready_timeout: 10s
    ready_poll_interval: 200ms
    # OCS /session/{id}/command and /message block until the turn completes, so
    # the HTTP timeout must tolerate long-running turns (native skill dispatch
    # calls the blocking command endpoint). 5m mirrors the claudecode input
    # delivery timeout.
    http_timeout: 5m
    # Fallback context window size (tokens). OCS HTTP API does not expose the
    # real model context window, so this configurable value feeds context_pct.
    # Default 200000; set 0 to leave context_pct unset. (spec §5 O1)
    context_window: 200000

  codex_cli:
    # Command to start Codex CLI worker. Default: "codex"
    command: "codex"
    # Model name. Empty = use Codex default model from ~/.codex/config.toml
    model: ""
    # Sandbox mode: read-only, workspace-write, danger-full-access
    # YOLO mode (default): danger-full-access grants full filesystem + network access.
    # For restricted sandbox, use workspace-write or read-only.
    # ⚠ Default changed from workspace-write to danger-full-access in v1.26 —
    #   existing deployments without explicit sandbox config will gain elevated permissions.
    sandbox: "danger-full-access"
    # Approval mode: untrusted, on-request, never
    # YOLO mode (default): never skips all approval prompts — commands run immediately.
    approval_mode: "never"
    # Ephemeral sessions (don't persist to disk)
    ephemeral: true
    # Process startup timeout
    startup_timeout: 30s
    # Idle drain timeout for app-server mode before killing process
    idle_drain_period: 30m

  # ACP (Agent Communication Protocol) — universal worker for any ACP-compatible agent.
  # Communicates via JSON-RPC 2.0 over stdio.
  acp:
    # Command to start ACP agent. Use space to separate subcommand args.
    # Override via HOTPLEX_WORKER_ACP_COMMAND environment variable.
    command: "hermes acp"
    # Auto-approve permission requests from the agent (no user confirmation needed).
    # WARNING: auto_approve: true grants full tool access without human review.
    # Consider keeping false in production environments.
    auto_approve: true
    # Extra arguments appended after the command (e.g., model selection, verbose mode).
    # Override via HOTPLEX_WORKER_ACP_ARGS environment variable.
    # Note: env var is split on whitespace; quoted values with spaces are not supported.
    # args:
    #   - "--model"
    #   - "claude-sonnet-4-6"
    # Enable protocol-level debug tracing to ~/.hotplex/logs/acp-trace-*.jsonl.
    # Override via HOTPLEX_WORKER_ACP_DEBUG environment variable.
    # WARNING: trace files contain full prompts and agent responses, including
    # potentially sensitive data. Enable only for debugging and delete after use.
    debug: false

# ─────────────────────────────────────────────────────────────────────────────
# AGENT PERSONALITY & SKILLS (B/C Channels)
# ─────────────────────────────────────────────────────────────────────────────

agent_config:
  enabled: true
  # Root directory for AgentConfig (SOUL.md, AGENTS.md, TOOLS.md, USER.md, MEMORY.md)
  # and user context (USER.md, MEMORY.md).
  config_dir: ~/.hotplex/agent-configs

skills:
  cache_ttl: 5m

# ─────────────────────────────────────────────────────────────────────────────
# OBSERVABILITY & UI
# ─────────────────────────────────────────────────────────────────────────────

log:
  level: "info"
  format: "json" # "json" or "text"
  # File logging + rotation. Disabled by default (logs go to stderr only,
  # matching daemon-mode stderr redirection). Enable to tee logs to a rotated
  # file; in foreground/TTY mode logs still appear on stderr too.
  file:
    enabled: false
    path: "" # empty → ~/.hotplex/logs/gateway.log
    max_size: 10 # MB per file before rotation
    max_age: 30 # days to retain rotated logs
    max_backups: 100 # number of rotated backups to keep
    compress: true # gzip rotated backups
    local_time: true # use local time in rotation filenames

webchat:
  addr: ""      # informational: banner display only
  enabled: true  # serve embedded webchat SPA from gateway

# ─────────────────────────────────────────────────────────────────────────────
# MESSAGING PLATFORMS
# ─────────────────────────────────────────────────────────────────────────────

messaging:
  # Send turn summary after each completed turn (default: true).
  turn_summary_enabled: true

  # ── Shared defaults (inherited by all platforms, overridable per-platform) ──
  worker_type: "claude_code"

  # STT (Speech-to-Text)
  stt_provider: "local"
  stt_local_cmd: "python3 ~/.hotplex/scripts/stt_server.py"
  stt_local_idle_ttl: 15m

  # TTS (Text-to-Speech) — voice replies for voice-triggered turns
  tts_enabled: true
  # Provider: edge (Edge TTS, free), moss (MOSS-TTS-Nano local CPU),
  #   edge+moss (Edge primary + MOSS fallback)
  tts_provider: "edge+moss"
  tts_voice: "zh-CN-XiaoxiaoNeural"
  tts_max_chars: 150
  # MOSS-TTS-Nano sidecar settings
  tts_moss_model_dir: "~/.hotplex/models/moss-tts-nano"
  tts_moss_voice: "Xiaoyu"
  tts_moss_port: 18083
  tts_moss_idle_timeout: 30m
  tts_moss_cpu_threads: 0

  # ── Platform-specific configs ──────────────────────────────────────────────
  slack:
    enabled: false
    socket_mode: true
    require_mention: true
    # Override shared defaults here if needed, e.g.:
    # tts_provider: "edge"
    # Assistant status branding (optional):
    # display_name: "HotPlex AI"
    # icon_emoji: ":robot_face:"
    # Multi-bot support (uncomment to use):
    # bots:
    #   - name: tech-support
    #     bot_token: xoxb-xxx
    #     app_token: xapp-xxx
    #     soul: tech-support
    #   - name: hr-bot
    #     bot_token: xoxb-yyy
    #     app_token: xapp-yyy
    #     soul: hr-assistant

  feishu:
    enabled: false
    require_mention: true
    # Dedicated host-operation allowlist (Feishu sender open_id); empty = deny all.
    # gateway_restart_allow_from: [ou_operator_open_id]
    # Override shared defaults here if needed, e.g.:
    # tts_provider: "edge"
    # Multi-bot support (uncomment to use):
    # bots:
    #   - name: tech-support
    #     app_id: cli_xxx
    #     app_secret: xxx
    #     soul: tech-support
    #   - name: hr-bot
    #     app_id: cli_yyy
    #     app_secret: yyy
    #     soul: hr-assistant

# ── Cron Scheduler ─────────────────────────────────────────────────────────
# AI-native cronjob engine: natural language prompt as payload, results
# delivered to the creator's platform (Feishu card / Slack message).
# Docs: https://github.com/hrygo/hotplex/tree/main/internal/cron
cron:
  enabled: true
  # max_concurrent_runs: 3      # Max parallel job executions
  # max_jobs: 50                # Max registered jobs
  # default_timeout_sec: 300    # Per-job timeout (5 min)
  # tick_interval_sec: 60       # Scheduler tick interval
