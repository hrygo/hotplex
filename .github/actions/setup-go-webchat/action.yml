name: 'Setup Go + Webchat'
description: 'Install Go, pnpm, Node.js, build webchat SPA, download Go modules'

inputs:
  go-version:
    description: 'Go version'
    required: false
    default: '1.26'
  node-version:
    description: 'Node.js version'
    required: false
    default: '22'
  pnpm-version:
    description: 'pnpm version'
    required: false
    default: '11.4.0'
  build-webchat:
    description: 'Whether to build webchat SPA (if false, still restores from cache)'
    required: false
    default: 'true'
  download-modules:
    description: 'Whether to download Go modules'
    required: false
    default: 'true'

runs:
  using: 'composite'
  steps:
    # cache: false → we manage our own cache with restore-keys below,
    # so a go.sum change doesn't invalidate the ENTIRE build cache.
    - uses: actions/setup-go@v6
      with:
        go-version: ${{ inputs.go-version }}
        cache: false

    - name: Cache Go modules + build cache
      uses: actions/cache@v5
      with:
        path: |
          ~/go/pkg/mod
          ~/.cache/go-build
        key: ${{ runner.os }}-go-webchat-${{ hashFiles('**/go.sum') }}
        restore-keys: |
          ${{ runner.os }}-go-webchat-

    # Always restore webchat from cache — needed for go vet ./...
    # which compiles internal/webchat even if we don't test it.
    - name: Restore webchat build output
      id: webchat-cache
      uses: actions/cache@v5
      with:
        path: internal/webchat/out
        key: webchat-v2-${{ hashFiles('webchat/app/**', 'webchat/components/**', 'webchat/context/**', 'webchat/hooks/**', 'webchat/lib/**', 'webchat/public/**', 'webchat/types/**', 'webchat/next.config.*', 'webchat/package.json', 'webchat/pnpm-lock.yaml') }}

    - uses: pnpm/action-setup@v6
      if: steps.webchat-cache.outputs.cache-hit != 'true'
      with:
        version: ${{ inputs.pnpm-version }}

    - uses: actions/setup-node@v6
      if: steps.webchat-cache.outputs.cache-hit != 'true'
      with:
        node-version: ${{ inputs.node-version }}
        cache: 'pnpm'
        cache-dependency-path: webchat/pnpm-lock.yaml

    - name: Build webchat SPA
      if: steps.webchat-cache.outputs.cache-hit != 'true'
      shell: bash
      run: make webchat-embed

    - name: Download Go modules
      if: inputs.download-modules == 'true'
      shell: bash
      run: go mod download

    - name: Restore swagger output
      id: swagger-cache
      uses: actions/cache@v5
      with:
        path: docs/swagger/swagger.json
        key: swagger-v1-${{ hashFiles('cmd/hotplex/doc.go', 'internal/admin/*.go', 'internal/gateway/api.go') }}

    - name: Restore docs build output
      id: docs-cache
      uses: actions/cache@v5
      with:
        path: internal/docs/out
        key: docs-${{ hashFiles('docs/**/*.md', 'cmd/hotplex/doc.go', 'internal/admin/*.go', 'internal/gateway/api.go', 'cmd/build-docs/**') }}

    - name: Install swag
      if: steps.docs-cache.outputs.cache-hit != 'true' && steps.swagger-cache.outputs.cache-hit != 'true'
      shell: bash
      run: go install github.com/swaggo/swag/cmd/swag@v1.16.4

    - name: Generate swagger (if not cached)
      if: steps.swagger-cache.outputs.cache-hit != 'true'
      shell: bash
      run: |
        # Self-heal when swagger-cache misses but swag was never installed
        # (e.g. docs-cache hit skips the Install step above): without this,
        # `make swagger` fails with "swag not found".
        if ! command -v swag > /dev/null 2>&1; then
          go install github.com/swaggo/swag/cmd/swag@v1.16.4
        fi
        make swagger

    - name: Build docs
      if: steps.docs-cache.outputs.cache-hit != 'true'
      shell: bash
      run: go run ./cmd/build-docs
