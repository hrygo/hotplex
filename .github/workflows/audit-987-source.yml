name: Audit 987 source snapshot
on:
  push:
    branches: [chore/987-audit-bootstrap]
    paths: [.github/workflows/audit-987-source.yml]
permissions:
  contents: read
jobs:
  export:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v6
        with:
          ref: 1887b9b932be307120483a91cb2ce5f1e864ea97
          fetch-depth: 1
          persist-credentials: false
      - name: Export source and provenance
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/source"
          git archive --format=tar.gz HEAD > "$RUNNER_TEMP/source/hotplex-pr986.tar.gz"
          git rev-parse HEAD > "$RUNNER_TEMP/source/COMMIT"
          git rev-parse HEAD^{tree} > "$RUNNER_TEMP/source/TREE"
          git ls-files -s > "$RUNNER_TEMP/source/FILES"
          git cat-file commit HEAD > "$RUNNER_TEMP/source/COMMIT_OBJECT"
          sha256sum "$RUNNER_TEMP/source/hotplex-pr986.tar.gz" > "$RUNNER_TEMP/source/SHA256SUMS"
      - uses: actions/upload-artifact@v4
        with:
          name: hotplex-pr986-source-1887b9b
          path: ${{ runner.temp }}/source/
          retention-days: 7
          compression-level: 0
