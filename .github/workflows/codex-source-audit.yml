name: Codex worker-channel audit

on:
  push:
    branches: [codex/source-audit-bootstrap-20260912]
    paths:
      - .github/workflows/codex-source-audit.yml
      - scripts/audit/**

permissions:
  contents: read

concurrency:
  group: codex-worker-channel-audit
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - name: Preserve bootstrap harness outside the product worktree
        run: |
          mkdir -p "$RUNNER_TEMP/hotplex-audit"
          cp scripts/audit/worker_channel_hardening.py "$RUNNER_TEMP/hardening.py"
      - uses: actions/checkout@v6
        with:
          ref: 29a23f02fa2874b9e856f2c0c1529f537f5f4ba4
          fetch-depth: 1
          persist-credentials: false
      - uses: ./.github/actions/setup-go-webchat
        with:
          build-webchat: 'false'
      - name: Install required hooks and add regression tests
        run: |
          set -euo pipefail
          make hooks
          go version | tee "$RUNNER_TEMP/hotplex-audit/toolchain.txt"
          git rev-parse HEAD | tee "$RUNNER_TEMP/hotplex-audit/base.txt"
          python "$RUNNER_TEMP/hardening.py" tests
          find internal -name '*_audit_test.go' -exec gofmt -w {} +
      - name: Reproduce defects on the unmodified implementation
        id: red
        run: |
          set +e
          go test -json -race -count=1 -shuffle=on -timeout=2m -run '^TestAudit' \
            ./internal/worker/base ./internal/worker/acp ./internal/worker/opencodeserver \
            ./internal/messaging ./internal/messaging/feishu ./internal/gateway \
            > "$RUNNER_TEMP/hotplex-audit/red.jsonl" 2>&1
          result=$?
          echo "baseline_exit=$result" | tee "$RUNNER_TEMP/hotplex-audit/red-exit.txt"
          tail -80 "$RUNNER_TEMP/hotplex-audit/red.jsonl"
          exit 0
      - name: Apply the exact-source fixes
        run: |
          set -euo pipefail
          python "$RUNNER_TEMP/hardening.py" fixes
          git add -N internal
          git diff --name-only -- '*.go' | xargs gofmt -w
          git diff --check
          git diff --stat
      - name: Run repaired regressions repeatedly with the race detector
        run: |
          set -euo pipefail
          go test -json -race -count=5 -shuffle=on -timeout=3m -run '^(TestAudit|TestEventGate)' \
            ./internal/worker/base ./internal/worker/acp ./internal/worker/opencodeserver \
            ./internal/messaging ./internal/messaging/feishu ./internal/gateway \
            > "$RUNNER_TEMP/hotplex-audit/green.jsonl" 2>&1
          tail -40 "$RUNNER_TEMP/hotplex-audit/green.jsonl"
      - name: Run existing worker, messaging and gateway suites
        run: |
          set -euo pipefail
          GORACE=history_size=5 go test -json -short -race -count=1 -shuffle=on -timeout=10m \
            ./internal/worker/... ./internal/messaging/... ./internal/gateway/... \
            > "$RUNNER_TEMP/hotplex-audit/broad.jsonl" 2>&1
          tail -40 "$RUNNER_TEMP/hotplex-audit/broad.jsonl"
      - name: Run the existing twelve-combination contract gate
        run: |
          set -o pipefail
          make test-contract-matrix | tee "$RUNNER_TEMP/hotplex-audit/contract-matrix.log"
      - name: Summarize evidence and reject false red results
        run: |
          python - <<'PY'
          import json, os
          from pathlib import Path
          root = Path(os.environ['RUNNER_TEMP']) / 'hotplex-audit'
          summary = {}
          for name in ('red', 'green', 'broad'):
              records = []
              for line in (root / (name + '.jsonl')).read_text().splitlines():
                  try: record = json.loads(line)
                  except json.JSONDecodeError: continue
                  if record.get('Action') in ('pass', 'fail', 'skip') and record.get('Test'):
                      records.append({key: record[key] for key in ('Package', 'Test', 'Action')})
              summary[name] = {action: [r for r in records if r['Action'] == action] for action in ('pass', 'fail', 'skip')}
          (root / 'summary.json').write_text(json.dumps(summary, indent=2))
          for name, group in summary.items():
              print(name, {key: len(val) for key, val in group.items()})
          required = ['TestAuditProcCompletionPreservesReplacement', 'TestAuditConnTrySendAfterClose', 'TestAuditDedupExpiresBeforeSweep', 'TestAuditDedupCloseBeforeStart', 'TestAuditChatQueuePanicPreservesAcceptedTail', 'TestAuditPlatformTimerRearmsAfterFlush', 'TestAuditPlatformReasoningIsNotTextCoalesced', 'TestAuditPromptPreservesWorkspaceDirectory']
          failed = {r['Test'].split('/')[0] for r in summary['red']['fail']}
          missing = set(required) - failed
          if missing:
              raise SystemExit('Missing per-test baseline failure evidence: ' + ', '.join(sorted(missing)))
          if summary['green']['fail'] or summary['green']['skip']:
              raise SystemExit('Repaired regression suite must have no failures or skips')
          PY
      - name: Preserve small review artifacts even on failure
        if: always()
        run: |
          mkdir -p "$RUNNER_TEMP/hotplex-audit"
          git add -N internal || true
          git diff --binary > "$RUNNER_TEMP/hotplex-audit/hardening.patch"
          git diff --stat > "$RUNNER_TEMP/hotplex-audit/diff-stat.txt"
          git diff --name-only > "$RUNNER_TEMP/hotplex-audit/changed-files.txt"
          tail -100 "$RUNNER_TEMP/hotplex-audit/green.jsonl" 2>/dev/null || true
          tail -80 "$RUNNER_TEMP/hotplex-audit/broad.jsonl" 2>/dev/null || true
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: hotplex-hardening-evidence-${{ github.run_number }}
          path: ${{ runner.temp }}/hotplex-audit/
          retention-days: 7
