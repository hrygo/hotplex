name: Audit 987 ten runtime fixes
on:
  push:
    branches: [chore/987-documented-audit-20260912]
    paths:
      - .github/workflows/audit-987-runtime-series.yml
permissions:
  contents: write
concurrency:
  group: audit-987-runtime-series
  cancel-in-progress: false
jobs:
  verify-publish:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - name: Validate patch transport and preserve verifier outside product tree
        run: |
          python - <<'PY'
          import base64, gzip, hashlib, os
          from pathlib import Path
          names=['part1','part2','part3a','part3b','part4']
          encoded=''.join(Path('scripts/audit/runtime-fixes.'+name).read_text().strip() for name in names)
          raw=gzip.decompress(base64.b64decode(encoded,validate=True))
          digest=hashlib.sha256(raw).hexdigest()
          assert digest=='1eabfd75485a7f2a38636edbe732d2fe56c0c6fb740711722a021bc5ce8a1bf9',digest
          temp=Path(os.environ['RUNNER_TEMP'])
          (temp/'runtime-patchset.json').write_bytes(raw)
          for name in ('publish-runtime-series.py','polish-runtime-series.py'):
              (temp/name).write_bytes(Path('scripts/audit',name).read_bytes())
          (temp/'runtime-series-evidence').mkdir(exist_ok=True)
          (temp/'runtime-series-evidence/PATCHSET_SHA256').write_text(digest+'\n')
          print('Patch transport SHA-256 verified:',digest)
          PY
      - uses: actions/checkout@v6
        with:
          ref: fb53e8be5ee8171ccb11e6eefe9fc6625abb98e3
          fetch-depth: 1
      - uses: ./.github/actions/setup-go-webchat
        with:
          build-webchat: 'false'
      - uses: golangci/golangci-lint-action@v9.2.0
        with:
          version: v2.11.4
          install-only: true
      - name: Configure original hooks and preserve provenance
        run: |
          set -euo pipefail
          echo "$HOME/golangci-lint-2.11.4-linux-amd64" >> "$GITHUB_PATH"
          test -x "$HOME/golangci-lint-2.11.4-linux-amd64/golangci-lint"
          make hooks
          git rev-parse HEAD > "$RUNNER_TEMP/runtime-series-evidence/BASE"
          go version > "$RUNNER_TEMP/runtime-series-evidence/GO_VERSION"
          git rev-parse HEAD:scripts/git-hooks/pre-commit > "$RUNNER_TEMP/runtime-series-evidence/PRE_COMMIT_BLOB"
          git rev-parse HEAD:scripts/git-hooks/pre-push > "$RUNNER_TEMP/runtime-series-evidence/PRE_PUSH_BLOB"
          cp "$RUNNER_TEMP/polish-runtime-series.py" "$RUNNER_TEMP/runtime-series-evidence/normalization.py"
          test ! -e .github/workflows/audit-987-runtime-series.yml
      - name: Verify each root cause, commit each fix, and run full publication gates
        run: python "$RUNNER_TEMP/polish-runtime-series.py"
      - name: Preserve review evidence even on failure
        if: always()
        run: |
          mkdir -p "$RUNNER_TEMP/runtime-series-evidence"
          git diff --binary fb53e8be5ee8171ccb11e6eefe9fc6625abb98e3 > "$RUNNER_TEMP/runtime-series-evidence/series.patch" || true
          git diff --stat fb53e8be5ee8171ccb11e6eefe9fc6625abb98e3 > "$RUNNER_TEMP/runtime-series-evidence/series-stat.txt" || true
          for log in final-lint.log contract-matrix.log push.log; do
            echo "### $log"
            tail -100 "$RUNNER_TEMP/runtime-series-evidence/$log" 2>/dev/null || true
          done
          cat "$RUNNER_TEMP/runtime-series-evidence/series.json" 2>/dev/null || true
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: audit-987-runtime-series-${{ github.run_number }}
          path: ${{ runner.temp }}/runtime-series-evidence/
          retention-days: 7
