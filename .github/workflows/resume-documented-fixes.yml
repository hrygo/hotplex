name: Documented runtime repairs
on:
  push:
    branches: [chore/987-resume-runtime-fixes]
    paths: [.github/workflows/resume-documented-fixes.yml]
permissions:
  contents: read
concurrency:
  group: documented-runtime-repairs
  cancel-in-progress: false
jobs:
  repair:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
    strategy:
      fail-fast: false
      max-parallel: 5
      matrix:
        issue: [988, 990, 991, 993, 994]
    env:
      AUDIT_ISSUE: ${{ matrix.issue }}
      GORACE: history_size=5
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - name: Preserve exact repair recipes outside product checkout
        run: |
          mkdir -p "$RUNNER_TEMP/audit-tools" "$RUNNER_TEMP/evidence"
          cp scripts/deep-audit/*.py "$RUNNER_TEMP/audit-tools/"
          python -m compileall -q "$RUNNER_TEMP/audit-tools"
      - uses: actions/checkout@v6
        with:
          ref: fb53e8be5ee8171ccb11e6eefe9fc6625abb98e3
          fetch-depth: 1
      - uses: ./.github/actions/setup-go-webchat
        with:
          build-webchat: 'false'
      - uses: golangci/golangci-lint-action@v9.2.0
        with:
          version: v2.11.4
          install-only: true
      - name: Red-green regressions, existing suites, contracts and original hooks
        run: |
          set -euo pipefail
          export PATH="$HOME/golangci-lint-2.11.4-linux-amd64:$PATH"
          if command -v rtk >/dev/null; then rtk proxy make hooks; else make hooks; echo 'RTK unavailable; native make hooks used.'; fi
          python "$RUNNER_TEMP/audit-tools/resume.py"
      - name: Concise evidence summary
        if: always()
        run: |
          python - <<'PY'
          import json, os
          from pathlib import Path
          root=Path(os.environ['RUNNER_TEMP'])/'evidence'
          for path in sorted(root.glob('*.jsonl')):
              records=[]
              for line in path.read_text(errors='replace').splitlines():
                  try:r=json.loads(line)
                  except ValueError:continue
                  if isinstance(r,dict):records.append(r)
              print(path.name,{a:sum(r.get('Action')==a and bool(r.get('Test')) for r in records) for a in ('pass','fail','skip')})
              for r in records:
                  if r.get('Action')=='fail':print('FAILED',r.get('Package'),r.get('Test'))
          for name in ('product-commit.txt','lint.txt','push.txt'):
              p=root/name
              if p.exists():print(name,p.read_text(errors='replace')[-6000:])
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: documented-repair-${{ matrix.issue }}-${{ github.run_number }}
          path: ${{ runner.temp }}/evidence/
          retention-days: 14
