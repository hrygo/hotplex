name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Version tag to release (e.g., v1.0.0). Must already exist.'
        required: true
        type: string

# Read-only by default. Only the publish job can write, and it says so
# explicitly, so a blocked release fails loudly instead of quietly proceeding
# with whatever permissions happened to be inherited.
permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

env:
  GO_VERSION: '1.26'
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  # ── Resolve: pin an immutable SHA before anything else ────────────────
  # workflow_dispatch used to check out the default branch while stamping the
  # binary with the requested version string. That publishes one commit's code
  # under another version's name, and nothing in the old graph could detect it.
  resolve:
    name: Resolve release ref
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      sha: ${{ steps.resolve.outputs.sha }}
      version: ${{ steps.resolve.outputs.version }}
    steps:
      - name: Resolve tag to an immutable commit SHA
        id: resolve
        env:
          EVENT_NAME: ${{ github.event_name }}
          REF: ${{ github.ref }}
          REQUESTED: ${{ inputs.version }}
        run: |
          set -euo pipefail

          if [ "$EVENT_NAME" = "workflow_dispatch" ]; then
            TAG="${REQUESTED}"
            if [ -z "$TAG" ]; then
              echo "::error::workflow_dispatch requires a version tag"
              exit 1
            fi
          else
            TAG="${REF#refs/tags/}"
          fi

          case "$TAG" in
            v*) ;;
            *)
              echo "::error::Release tag '$TAG' must start with 'v'"
              exit 1
              ;;
          esac

          # Fetch the tag itself. A tag that does not exist must fail here, not
          # three jobs later after a release page already exists.
          git init -q .
          git remote add origin "https://github.com/${GITHUB_REPOSITORY}.git"
          git fetch -q --depth=1 origin "refs/tags/${TAG}:refs/tags/${TAG}"

          SHA="$(git rev-parse "refs/tags/${TAG}^{commit}")"
          if [ -z "$SHA" ]; then
            echo "::error::Tag '$TAG' did not resolve to a commit"
            exit 1
          fi

          echo "Releasing ${TAG} from ${SHA}"
          echo "sha=${SHA}" >> "$GITHUB_OUTPUT"
          echo "version=${TAG}" >> "$GITHUB_OUTPUT"

  # ── Validate: the same gate CI runs, against the SHA being released ────
  validate:
    name: Validate ${{ needs.resolve.outputs.version }}
    needs: [resolve]
    uses: ./.github/workflows/validate.yml
    with:
      ref: ${{ needs.resolve.outputs.sha }}
      ref-label: ${{ needs.resolve.outputs.version }}
      test-scope: 'full'

  # ── Prepare: build webchat once ────────────────────────────────────────
  prepare:
    name: Prepare
    needs: [resolve, validate]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ needs.resolve.outputs.sha }}

      - uses: ./.github/actions/setup-go-webchat
        with:
          download-modules: 'false'

      - uses: actions/upload-artifact@v7
        with:
          name: webchat-out
          path: internal/webchat/out
          retention-days: 1

      - uses: actions/upload-artifact@v7
        with:
          name: docs-out
          path: internal/docs/out
          retention-days: 1

  # ── Build ───────────────────────────────────────────────────────────────
  build:
    needs: [resolve, validate, prepare]
    name: Build ${{ matrix.os }}-${{ matrix.arch }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        os: [darwin, linux, windows]
        arch: [amd64, arm64]
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ needs.resolve.outputs.sha }}

      - name: Restore webchat
        uses: actions/download-artifact@v7
        with:
          name: webchat-out
          path: internal/webchat/out

      - name: Restore docs
        uses: actions/download-artifact@v7
        with:
          name: docs-out
          path: internal/docs/out

      - uses: actions/setup-go@v6
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true

      - run: go mod download

      - name: Install zip utility
        if: matrix.os == 'windows'
        run: sudo apt-get update -qq && sudo apt-get install -y -qq zip

      - name: Build
        env:
          CGO_ENABLED: 0
          GOOS: ${{ matrix.os }}
          GOARCH: ${{ matrix.arch }}
          LDFLAGS: -s -w
          VERSION: ${{ needs.resolve.outputs.version }}
          COMMIT: ${{ needs.resolve.outputs.sha }}
        run: |
          set -euo pipefail
          EXT=""
          [ "${{ matrix.os }}" = "windows" ] && EXT=".exe"
          NAME="hotplex-${{ matrix.os }}-${{ matrix.arch }}${EXT}"
          ARCHIVE="hotplex-${{ matrix.os }}-${{ matrix.arch }}"
          mkdir -p dist
          go build -ldflags="${LDFLAGS} -X main.version=${VERSION} -X main.commit=${COMMIT}" \
            -o "dist/${NAME}" ./cmd/hotplex

          # Each artifact records the SHA it was built from, so a downloaded
          # archive can be traced without trusting the release page it came from.
          printf 'version=%s\nsource_sha=%s\n' "${VERSION}" "${COMMIT}" > "dist/${ARCHIVE}.provenance"

          # Pack archive: tar.gz for unix, zip for windows
          cd dist
          if [ "${{ matrix.os }}" = "windows" ]; then
            zip -9 "${ARCHIVE}.zip" "${NAME}" "${ARCHIVE}.provenance"
          else
            tar -czf "${ARCHIVE}.tar.gz" "${NAME}" "${ARCHIVE}.provenance"
          fi

          # Per-leg digests travel with the archive, so the smoke job verifies
          # THESE bytes rather than trusting whatever the artifact store
          # returns later.
          if [ "${{ matrix.os }}" = "windows" ]; then
            sha256sum "${ARCHIVE}.zip" > "${ARCHIVE}.sha256"
          else
            sha256sum "${ARCHIVE}.tar.gz" > "${ARCHIVE}.sha256"
          fi

      - uses: actions/upload-artifact@v7
        with:
          name: dist-${{ matrix.os }}-${{ matrix.arch }}
          path: |
            dist/*.tar.gz
            dist/*.zip
            dist/*.provenance
            dist/*.sha256
          retention-days: 7

  # ── Offline Bundle (OpenCode + OMO) ────────────────────────────────────
  # Produces artifacts only. It used to publish to the release page itself, in
  # parallel with the release job and gated on nothing but a build, so a failed
  # or skipped validation still shipped bundles.
  offline-bundle:
    name: Pack offline bundle
    needs: [resolve, validate, build]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ needs.resolve.outputs.sha }}

      - uses: actions/setup-node@v6
        with:
          node-version: '22'

      - name: Verify the runtime lock
        # The bundle's OpenCode and Oh My OpenAgent versions come from the
        # committed lock, never from whatever upstream publishes today.
        run: python3 scripts/ci/check_runtime_lock.py --repo-root .

      - name: Show the locked versions
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          with open("configs/worker-runtime-lock.json", encoding="utf-8") as handle:
              lock = json.load(handle)
          print("opencode:", lock["runtimes"]["opencode"]["version"])
          print("omo:", lock["runtimes"]["oh-my-opencode"]["version"])
          print("lock digest:", lock["runtimes"]["opencode"]["assets"]["linux-x64"]["sha256"][:16], "...")
          PY

      - name: Pack bundles
        run: |
          set -euo pipefail
          chmod +x scripts/pack-offline-bundle.sh

          for PLATFORM in linux-x64 linux-x64-musl linux-arm64 linux-arm64-musl darwin-arm64 darwin-x64 windows-x64 windows-arm64; do
            echo "==> Packing ${PLATFORM}..."
            # No --opencode-version / --omo-version: those flags imply
            # --allow-dynamic, which is exactly the unreproducible build this
            # lock exists to prevent.
            bash scripts/pack-offline-bundle.sh \
              --platform "${PLATFORM}" \
              --output "dist/offline-bundle-${PLATFORM}"
          done

          ls -lh dist/hotplex-offline-bundle-*.tar.gz

      - name: Upload offline bundles
        uses: actions/upload-artifact@v7
        with:
          name: offline-bundle
          path: |
            dist/hotplex-offline-bundle-*.tar.gz
            dist/hotplex-offline-bundle-*.zip
          if-no-files-found: error
          retention-days: 7

  # ── Publish: the single owner of the release page ──────────────────────
  # ── Smoke: run the artifacts that were actually built ─────────────────
  # These jobs download the release archives and run them. They never rebuild:
  # a rebuild would prove the source compiles, not that the bytes people
  # download start. Only the (os, arch) pairs a hosted runner can actually
  # execute are covered; the rest stay build-only and are reported as such.
  smoke:
    name: Smoke ${{ matrix.target }}
    needs: [resolve, validate, build]
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: linux-amd64
            runner: ubuntu-latest
            artifact: dist-linux-amd64
          - target: linux-arm64
            runner: ubuntu-24.04-arm
            artifact: dist-linux-arm64
          - target: darwin-arm64
            runner: macos-latest
            artifact: dist-darwin-arm64
          - target: darwin-amd64
            runner: macos-15-intel
            artifact: dist-darwin-amd64
          - target: windows-amd64
            runner: windows-latest
            artifact: dist-windows-amd64
    steps:
      - name: Check out the released source
        # The smoke seeds a database from before the bounded input queue, so it
        # needs one file from the tree that was released — not from whatever
        # ref the workflow was dispatched on. Sparse because that fixture is
        # the only thing the smoke reads.
        uses: actions/checkout@v6
        with:
          ref: ${{ needs.resolve.outputs.sha }}
          sparse-checkout: internal/session/testdata
          persist-credentials: false

      - name: Download the built artifact
        uses: actions/download-artifact@v7
        with:
          name: ${{ matrix.artifact }}
          path: dist

      - name: Verify the archive checksum
        shell: bash
        run: |
          set -euo pipefail
          cd dist
          # The digest was recorded at build time and shipped beside the
          # archive. Without this the smoke would happily test whatever the
          # artifact store happened to hand back.
          sha256sum --check --quiet ./*.sha256

      - name: Extract
        id: extract
        # Windows is the only target packaged as a .zip. Every unix target
        # ships a flat tar.gz and is handled by the unix step below; running
        # both made this step fail on unix (it looked for a top-level directory
        # to move, which a flat archive does not have) and left two gateway
        # smoke runs competing for the same port.
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          Set-Location dist
          New-Item -ItemType Directory -Force -Path extracted | Out-Null
          $archive = Get-ChildItem -Filter 'hotplex-*.zip' | Select-Object -First 1
          if ($archive) {
            Expand-Archive -Path $archive.FullName -DestinationPath extracted
          } else {
            $tar = Get-ChildItem -Filter 'hotplex-*.tar.gz' | Select-Object -First 1
            if (-not $tar) { throw 'no release archive found' }
            # The binary and its provenance sit at the archive root, so there
            # is no directory to strip — extract straight into `extracted`.
            tar -xzf $tar.FullName -C extracted
          }
          $binary = Get-ChildItem -Path extracted -Filter 'hotplex*.exe' -Recurse | Select-Object -First 1
          if (-not $binary) {
            $binary = Get-ChildItem -Path extracted -Filter 'hotplex*' -File -Recurse |
              Where-Object { $_.Name -notlike '*.provenance' } | Select-Object -First 1
          }
          if (-not $binary) { throw 'no hotplex binary in archive' }
          "BINARY=$($binary.FullName)" >> $env:GITHUB_OUTPUT

      - name: Extract (unix)
        id: extract-unix
        if: runner.os != 'Windows'
        shell: bash
        run: |
          set -euo pipefail
          cd dist
          # The archive is built with the binary and its provenance at the
          # root, so this is a plain extraction with no directory to strip.
          mkdir -p extracted
          tar -xzf hotplex-*.tar.gz -C extracted
          BINARY=$(find extracted -type f -name 'hotplex*' ! -name '*.provenance' | head -1)
          if [ -z "$BINARY" ]; then
            echo "::error::no hotplex binary in archive"
            find extracted -type f | head -20
            exit 1
          fi
          # The consumer step starts in the workspace root, not in dist/, so a
          # path relative to dist/ does not resolve there. Record it absolute.
          BINARY="$PWD/$BINARY"
          chmod +x "$BINARY"
          echo "BINARY=$BINARY" >> "$GITHUB_OUTPUT"

      - name: Binary starts, migrates a fresh database, serves health, shuts down cleanly
        if: runner.os == 'Windows'
        shell: pwsh
        env:
          BINARY: ${{ steps.extract.outputs.BINARY }}
          PORT: 18888
        run: |
          $ErrorActionPreference = 'Stop'
          & $env:BINARY --help | Out-Null
          if ($LASTEXITCODE -ne 0) { throw "--help failed" }

          # An isolated HOTPLEX_HOME so the smoke never touches a real
          # installation, and an explicit config so the port does not depend on
          # whatever the default happens to be.
          $env:HOTPLEX_HOME = Join-Path $env:RUNNER_TEMP 'hotplex-smoke'
          New-Item -ItemType Directory -Force -Path $env:HOTPLEX_HOME | Out-Null
          # Built as a string, not a here-string: a here-string's body has to
          # start at column 0, and a column-0 line inside this run block ends
          # the YAML block scalar. That produced a release.yml GitHub refuses to
          # parse, while the gating checker — reading the file with its own line
          # parser — silently saw a workflow with no publish job.
          $config = "gateway:`n  addr: `"127.0.0.1:$env:PORT`""
          Set-Content -Path "$env:HOTPLEX_HOME\config.yaml" -Value $config -Encoding utf8
          # Seed a database from BEFORE the bounded input queue existed, so
          # startup runs the real upgrade instead of a fresh migration chain. A
          # fresh database only proves the first-start path.
          New-Item -ItemType Directory -Force -Path "$env:HOTPLEX_HOME\data" | Out-Null
          Copy-Item -Path 'internal/session/testdata/pre-queue-036.db' `
                     -Destination "$env:HOTPLEX_HOME\data\hotplex.db"

          $proc = Start-Process -FilePath $env:BINARY `
            -ArgumentList @('gateway', 'start', '--config', "$env:HOTPLEX_HOME\config.yaml") `
            -PassThru -RedirectStandardOutput "$env:RUNNER_TEMP\out.log" `
            -RedirectStandardError "$env:RUNNER_TEMP\err.log"
          try {
            $deadline = (Get-Date).AddSeconds(60)
            $healthy = $false
            while ((Get-Date) -lt $deadline) {
              Start-Sleep -Seconds 2
              if ($proc.HasExited) {
                Get-Content "$env:RUNNER_TEMP\err.log" -Tail 40
                throw "gateway exited early with code $($proc.ExitCode)"
              }
              try {
                $resp = Invoke-WebRequest -Uri "http://127.0.0.1:$env:PORT/health" -UseBasicParsing -TimeoutSec 5
                if ($resp.StatusCode -eq 200) { $healthy = $true; break }
              } catch { }
            }
            if (-not $healthy) {
              Get-Content "$env:RUNNER_TEMP\err.log" -Tail 40
              throw 'gateway did not become healthy'
            }
            Write-Host 'health OK'
            if (-not (Test-Path "$env:HOTPLEX_HOME\data\hotplex.db")) {
              Write-Host "::warning::no SQLite database at the expected path; migrations may live elsewhere"
            }
          } finally {
            if (-not $proc.HasExited) {
              # CloseMainWindow only posts WM_CLOSE, which a Go console process
              # does not act on. The v1.51.0 smoke proved it: the gateway sat
              # through the 30s timeout and was killed, so this asserted
              # nothing about its shutdown sequence. Ask the binary to stop
              # itself instead — the path an operator uses.
              & $env:BINARY gateway stop | Out-Null
              if ($LASTEXITCODE -ne 0) {
                Get-Content "$env:RUNNER_TEMP\err.log" -Tail 40
                throw "gateway stop failed with $LASTEXITCODE"
              }
              $null = $proc.WaitForExit(30000)
              if (-not $proc.HasExited) { $proc.Kill() }
            }
          }
          # Windows cannot verify the ordered teardown. proc.Terminate here is
          # a CTRL_BREAK_EVENT aimed at a process group this gateway does not
          # lead, so the CLI always escalates to TerminateProcess and the
          # process exits non-zero — the exit code proves nothing. What this
          # asserts is that `gateway stop` returned success, which it does only
          # once the process is actually gone. The teardown itself is covered by
          # the unix smokes, where SIGTERM is deliverable.
          Write-Host 'gateway stopped (Windows stops by force kill; teardown is covered by the unix smokes)'

      - name: Binary starts, migrates a fresh database, serves health, shuts down cleanly (unix)
        if: runner.os != 'Windows'
        shell: bash
        env:
          BINARY: ${{ steps.extract-unix.outputs.BINARY }}
          PORT: 18888
        run: |
          set -euo pipefail
          "$BINARY" --help >/dev/null

          export HOTPLEX_HOME="$RUNNER_TEMP/hotplex-smoke"
          mkdir -p "$HOTPLEX_HOME"
          # An explicit config keeps the port off whatever the default is.
          printf 'gateway:\n  addr: "127.0.0.1:%s"\n' "$PORT" > "$HOTPLEX_HOME/config.yaml"
          # Seed a database from BEFORE the bounded input queue existed, so
          # startup runs the real upgrade instead of a fresh migration chain.
          # A fresh database only ever proves the first-start path; this is the
          # path an existing installation actually takes, and it is the reason
          # the pre-migration fixture is committed.
          mkdir -p "$HOTPLEX_HOME/data"
          cp internal/session/testdata/pre-queue-036.db "$HOTPLEX_HOME/data/hotplex.db"

          "$BINARY" gateway start --config "$HOTPLEX_HOME/config.yaml" \
            >"$RUNNER_TEMP/out.log" 2>"$RUNNER_TEMP/err.log" &
          PID=$!
          cleanup() {
            if kill -0 "$PID" 2>/dev/null; then
              # SIGTERM first: the gateway has an ordered shutdown sequence
              # and a SIGKILL here would prove nothing about it.
              kill -TERM "$PID" 2>/dev/null || true
              for _ in $(seq 1 30); do
                kill -0 "$PID" 2>/dev/null || return 0
                sleep 1
              done
              kill -KILL "$PID" 2>/dev/null || true
            fi
          }
          trap cleanup EXIT

          for _ in $(seq 1 60); do
            if ! kill -0 "$PID" 2>/dev/null; then
              echo "gateway exited during startup"
              tail -40 "$RUNNER_TEMP/err.log"
              exit 1
            fi
            if curl -fsS "http://127.0.0.1:${PORT}/health" >/dev/null 2>&1; then
              echo "health OK"
              break
            fi
            sleep 1
          done
          curl -fsS "http://127.0.0.1:${PORT}/health" >/dev/null

          kill -TERM "$PID"
          for _ in $(seq 1 30); do
            kill -0 "$PID" 2>/dev/null || break
            sleep 1
          done
          if kill -0 "$PID" 2>/dev/null; then
            echo "::error::gateway ignored SIGTERM"
            tail -40 "$RUNNER_TEMP/err.log"
            exit 1
          fi
          wait "$PID" 2>/dev/null || true
          echo "graceful shutdown OK"

      - name: Upload smoke logs on failure
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: smoke-logs-${{ matrix.target }}
          path: ${{ runner.temp }}/**/*.log
          if-no-files-found: ignore
          retention-days: 7

  # ── Publish: the single owner of the release page ──────────────────────
  publish:
    name: Publish ${{ needs.resolve.outputs.version }}
    needs: [resolve, validate, build, offline-bundle, smoke]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
      # Keyless signing and provenance attestation use OIDC, not a key we own.
      # No private key is created, purchased or stored by this workflow.
      id-token: write
      attestations: write
    steps:
      - name: Download all binaries
        uses: actions/download-artifact@v7
        with:
          pattern: dist-*
          path: dist
          merge-multiple: true

      - name: Download offline bundles
        uses: actions/download-artifact@v7
        with:
          name: offline-bundle
          path: dist

      - name: Record release provenance
        env:
          VERSION: ${{ needs.resolve.outputs.version }}
          SHA: ${{ needs.resolve.outputs.sha }}
        run: |
          set -euo pipefail
          printf 'version=%s\nsource_sha=%s\n' "${VERSION}" "${SHA}" > dist/source-sha.txt

      - name: Generate checksums
        run: |
          set -euo pipefail
          cd dist
          # Only shipped artifacts are checksummed. The checksum file is written
          # last and is deliberately not part of its own input list.
          sha256sum hotplex-*.tar.gz hotplex-*.zip > checksums.txt
          if compgen -G 'hotplex-offline-bundle-*' > /dev/null; then
            sha256sum hotplex-offline-bundle-*.tar.gz >> checksums.txt 2>/dev/null || true
            sha256sum hotplex-offline-bundle-*.zip >> checksums.txt 2>/dev/null || true
          fi
          echo "=== Checksums ==="
          cat checksums.txt
          echo ""
          echo "=== Integrity check ==="
          sha256sum --check --quiet checksums.txt

      - name: Verify every artifact declares this SHA
        env:
          SHA: ${{ needs.resolve.outputs.sha }}
        run: |
          set -euo pipefail
          COUNT=0
          for prov in dist/hotplex-*.provenance; do
            [ -e "$prov" ] || continue
            COUNT=$((COUNT + 1))
            if ! grep -qx "source_sha=${SHA}" "$prov"; then
              echo "::error::${prov} does not declare source_sha=${SHA}"
              exit 1
            fi
          done
          if [ "$COUNT" -eq 0 ]; then
            echo "::error::No provenance files found; artifacts cannot be tied to a source SHA"
            exit 1
          fi
          echo "${COUNT} provenance file(s) declare ${SHA}"

      - name: Generate SBOMs
        uses: anchore/sbom-action@v0.24.3
        with:
          path: dist
          format: cyclonedx-json
          output-file: sbom
          artifact-name: sbom

      - name: Sign the checksums
        uses: sigstore/cosign-installer@v4.1.2

      - name: Keyless-sign checksums.txt
        env:
          DIGEST: ${{ needs.resolve.outputs.sha }}
        run: |
          set -euo pipefail
          cosign sign-blob --yes --output-signature dist/checksums.txt.sig dist/checksums.txt

      - name: Attest build provenance
        uses: actions/attest-build-provenance@v4.2.2
        with:
          subject-path: dist/hotplex-*.tar.gz

      - name: Verify what is about to be published
        env:
          SHA: ${{ needs.resolve.outputs.sha }}
        run: |
          set -euo pipefail
          # The same verification a downloader performs: checksums, declared
          # source SHA, an SBOM per artifact, a signature and an attestation.
          # It runs here so a broken release fails before the page exists,
          # rather than being discovered by whoever installs it.
          python3 scripts/ci/verify_release_artifacts.py --dir dist --expect-sha "${SHA}"

      - name: Create Release
        uses: softprops/action-gh-release@v3.0.0
        with:
          draft: false
          prerelease: ${{ contains(needs.resolve.outputs.version, 'alpha') || contains(needs.resolve.outputs.version, 'beta') || contains(needs.resolve.outputs.version, 'rc') }}
          generate_release_notes: true
          files: |
            dist/hotplex-*.tar.gz
            dist/hotplex-*.zip
            dist/hotplex-offline-bundle-*.tar.gz
            dist/hotplex-offline-bundle-*.zip
            dist/checksums.txt
            dist/source-sha.txt
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
