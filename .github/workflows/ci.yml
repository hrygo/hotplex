name: CI

on:
  push:
    branches: [main]
    paths:
      - '**.go'
      - 'go.mod'
      - 'go.sum'
      - 'Makefile'
      - 'scripts/**'
      - 'webchat/**'
      - 'internal/webchat/**'
      - 'configs/**'
      - 'docs/**/*.md'
      - 'cmd/build-docs/**'
      - 'pkg/aep/schema/**'
      - 'examples/**'
      - '.github/workflows/**'
  pull_request:
    branches: [main]
    paths:
      - '**.go'
      - 'go.mod'
      - 'go.sum'
      - 'Makefile'
      - 'scripts/**'
      - 'webchat/**'
      - 'internal/webchat/**'
      - 'configs/**'
      - 'docs/**/*.md'
      - 'cmd/build-docs/**'
      - 'pkg/aep/schema/**'
      - 'examples/**'
      - '.github/workflows/**'

env:
  # TODO: remove after Node 24 becomes the default runtime for GitHub Actions
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # The gate itself lives in a reusable workflow so Release can run the exact
  # same checks against the exact SHA it is about to publish. Keeping a second
  # copy here is how release and CI drift apart, which is what let an untested
  # SHA reach the release page in the first place.
  validate:
    name: Validate
    uses: ./.github/workflows/validate.yml
    with:
      ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
      ref-label: ${{ github.event_name == 'pull_request' && github.head_ref || github.ref_name }}
      # A PR pays for only what it touched (plus the reverse test-dependency
      # closure of it); main pays for everything, because that is the state
      # release would publish from.
      test-scope: ${{ github.event_name == 'pull_request' && 'affected' || 'full' }}
      base-sha: ${{ github.event.pull_request.base.sha }}
      test-shards: ${{ github.event_name == 'pull_request' && '[""]' || '["0","1","2"]' }}

  # ── Prune: artifacts consumed within a run, then deleted ───────────────
  # Coverage shards land on every push to main; without active pruning the
  # repository accumulates them until GitHub's backend expiry (which lags the
  # retention-days upload setting). Delete every artifact whose run has
  # finished. Kept: artifacts of the current run and of any in-progress run
  # (nothing here consumes cross-run artifacts, so this is safe). Runs in
  # parallel and never blocks CI.
  prune-artifacts:
    name: Prune stale artifacts
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read
      actions: write
    steps:
      - name: Delete artifacts from prior runs
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          repo="$GITHUB_REPOSITORY"
          current_run="$GITHUB_RUN_ID"

          artifacts_file="$(mktemp)"
          runs_file="$(mktemp)"
          trap 'rm -f "$artifacts_file" "$runs_file"' EXIT

          if ! gh api --paginate "repos/$repo/actions/artifacts?per_page=100" \
              > "$artifacts_file" 2>/dev/null; then
            echo "::warning::Cannot list actions artifacts (read-only token, e.g. fork PR?); skipping prune"
            exit 0
          fi
          if ! gh api "repos/$repo/actions/runs?status=in_progress&per_page=100" \
              > "$runs_file" 2>/dev/null; then
            echo "::warning::Cannot list in-progress runs; skipping prune"
            exit 0
          fi

          keep_runs="$(jq -r '.workflow_runs[].id' "$runs_file")"
          keep_set="$(printf '%s\n%s\n' "$current_run" "$keep_runs" \
            | sort -n | uniq | tr '\n' ' ')"
          deleted=0
          while IFS=$'\t' read -r artifact_id run_id name; do
            case " $keep_set " in
              *" $run_id "*) ;;
              *)
                echo "Deleting artifact $artifact_id ($name) from run $run_id"
                if gh api -X DELETE "repos/$repo/actions/artifacts/$artifact_id" \
                    >/dev/null 2>&1; then
                  deleted=$((deleted + 1))
                else
                  echo "  (delete failed — artifact may already be expired)"
                fi
                ;;
            esac
          done < <(jq -sr '[.[].artifacts[] | select(.expired == false)] |
              .[] | "\(.id)\t\(.workflow_run.id)\t\(.name)"' "$artifacts_file")
          echo "Deleted $deleted stale artifact(s)"
